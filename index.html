
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Simpsons</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Universo Simpsons</h1>
        <p>Bem-vindo a Springfield!</p>
    </header>

    <main>
        <section class="personagens">
            <h2>Conheça a Família Simpson</h2>

            <div class="pesquisa">
                <input
                    type="text"
                    id="campoPesquisa"
                    placeholder="Digite o nome de um personagem..."
                    aria-label="Pesquisar personagens"
                >
                <p id="mensagemPesquisa" aria-live="polite"></p>
            </div>

            <div class="grade-personagens">
                <p>Carregando personagens...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Projeto acadêmico - UniFECAF - 2026</p>
    </footer>

</body>
</html>
